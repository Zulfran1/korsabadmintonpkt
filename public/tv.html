<!DOCTYPE html>
<html lang="id" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Lapangan — KORSA 2026 Bulu Tangkis</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/korsa.css">
</head>
<body class="tv-page">

<div class="tv-card" id="card">
  <!-- Dirender oleh js/tv.js -->
</div>

<!-- Tombol maximize — muncul saat hover / focus -->
<div class="tv-controls" id="tv-controls">
  <button class="tv-controls__btn" id="tv-btn-fullscreen" type="button" title="Layar Penuh">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"
            fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button class="tv-controls__btn" id="tv-btn-exit-fullscreen" type="button" title="Keluar Layar Penuh" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M9 4v4H5M15 4v4h4M9 20v-4H5M15 20v-4h4"
            fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<script type="module" src="js/tv-init.js"></script>

</body>
</html>
